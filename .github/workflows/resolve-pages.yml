name: Resolver enlaces de GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pages_sources.py'
      - '.github/workflows/resolve-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogo-fm1
  cancel-in-progress: false
jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas del resolvedor
        run: python -m unittest discover -s tests -v
      - name: Comprobar manifiestos y archivos de los autores (no consulta el Hub)
        run: python scripts/update_catalog.py --pages-only
      - name: Guardar enlaces verificados si hay cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json
          if git diff --cached --quiet; then
            echo 'Sin enlaces nuevos verificados.'
          else
            git commit -m 'chore: resolver descargas de autores desde GitHub Pages'
            git push
          fi
