name: Actualizar catálogo FM-1
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogo-fm1
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar, validar y comparar el catálogo
        run: python scripts/update_catalog.py
      - name: Publicar cambios si hay novedades
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json public/changes.json
          if git diff --cached --quiet; then
            echo 'No hay nuevas versiones.'
          else
            git commit -m 'chore: actualizar catálogo FM-1'
            git push
          fi
